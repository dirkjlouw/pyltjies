<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0000aa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pyltjies">
  <title>Pyltjies</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="dos-frame">
      <div class="dos-line">
        <span class="prompt" aria-hidden="true">C:\DARTS&gt;</span>
        <h1>Pyltjies</h1>
        <span class="cursor" aria-hidden="true"></span>
      </div>
      <div class="dos-line">
        <span class="tagline">for tossers</span>
        <span class="who" id="who" hidden></span>
      </div>
    </div>
  </header>

  <main>
    <section id="view-signin" class="card" hidden>
      <h2>Sign in</h2>
      <p class="muted">We'll email you a 6-digit code. There's no password.</p>
      <p class="notice" id="signin-error" role="alert" hidden></p>
      <form id="email-form">
        <label>Email <input name="email" type="email" autocomplete="email" inputmode="email" required></label>
        <div class="actions"><button type="submit" class="primary">Send code</button></div>
      </form>
      <form id="code-form" hidden>
        <p class="muted" id="code-sent"></p>
        <label>6-digit code <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" required></label>
        <label id="name-field" hidden>Your name <input name="name" type="text" maxlength="40" autocomplete="given-name"></label>
        <div class="actions">
          <button type="submit" class="primary">Sign in</button>
          <button type="button" id="code-back" class="quiet">Back</button>
        </div>
      </form>
    </section>

    <nav class="nav" id="nav" aria-label="Main" hidden>
      <button type="button" data-view="play">Play</button>
      <button type="button" data-view="log">Banter</button>
      <button type="button" data-view="ladder">Ladder</button>
      <button type="button" data-view="you">You</button>
    </nav>

    <div id="screen"></div>
  </main>

  <footer class="foot"><span id="version"></span></footer>
</body>
</html>
