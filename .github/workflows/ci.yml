name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Shell scripts parse
        run: bash -n scripts/*.sh

  phones:
    # iPhone (WebKit), Android and desktop (Chromium). Same image locally: see playwright.config.js.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pyltjies:ci .
      - name: Start and check health
        run: |
          docker run -d --name pyltjies -p 8080:8080 pyltjies:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs pyltjies
          exit 1
